<!DOCTYPE html>
<html>
<head>
    <title>原生双HLS播放器</title>
    <style>
        body { margin: 20px; background: #000; color: #fff; }
        .videos { display: flex; gap: 10px; }
        video { width: 50%; background: #111; }
        .controls { margin: 10px 0; }
        input { width: 45%; margin: 5px; padding: 8px; }
        button { padding: 10px; background: #06c; color: #fff; border: none; }
    </style>
</head>
<body>
<div class="controls">
    <input id="url1" value="http://devimages.apple.com/iphone/samples/bipbop/gear1/prog_index.m3u8">
    <input id="url2" value="http://devimages.apple.com/iphone/samples/bipbop/gear1/prog_index.m3u8">
    <!-- <input id="url1" value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"> -->
    <!-- <input id="url2" value="https://bitdash-a.akamaihd.net/s/MVPT-1.1.0/playlists/ll-hls/big_buck_bunny_1080p_hls.m3u8"> -->
    <!-- https://skynewsau-live.akamaized.net/hls/live/2002689/skynewsau-extra1/master.m3u8 -->

    <button onclick="play()">播放</button>
</div>
<div class="videos">
    <video id="v1" controls></video>
    <video id="v2" controls></video>
</div>

<script>
    function play() {
        // 检测是否支持HLS
        const v1 = document.getElementById('v1');
        const canPlay = v1.canPlayType('application/vnd.apple.mpegurl');

        if (canPlay) {
            // Safari浏览器原生支持HLS
            v1.src = document.getElementById('url1').value;
            document.getElementById('v2').src = document.getElementById('url2').value;
        } else {
            alert('当前浏览器不支持原生HLS播放，请使用Safari浏览器');
        }
    }
</script>
</body>
</html>
