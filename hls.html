<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>双 HLS 流播放器</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: monospace;
            background: #000;
            color: #fff;
        }
        #container {
            display: flex;
            gap: 10px;
        }
        video {
            width: 50%;
            background: #111;
        }
        input {
            width: calc(50% - 20px);
            margin: 5px;
            padding: 8px;
            background: #222;
            color: #0f0;
            border: 1px solid #444;
            font-family: monospace;
        }
        button {
            margin: 5px;
            padding: 10px;
            background: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<input id="stream1" placeholder="HLS 流地址 1" value="http://devimages.apple.com/iphone/samples/bipbop/gear1/prog_index.m3u8">
<input id="stream2" placeholder="HLS 流地址 2" value="https://sf1-cdn-tos.huoshanstatic.com/obj/media-fe/xgplayer_doc_video/hls/xgplayer-demo.m3u8">
<button onclick="playAll()">同时播放</button>

<div id="container">
    <video id="video1" controls></video>
    <video id="video2" controls></video>
</div>

<script>
    function playAll() {
        const stream1 = document.getElementById('stream1').value;
        const stream2 = document.getElementById('stream2').value;

        // 播放第一个流
        const video1 = document.getElementById('video1');
        if (Hls.isSupported()) {
            const hls1 = new Hls();
            hls1.loadSource(stream1);
            hls1.attachMedia(video1);
        } else if (video1.canPlayType('application/vnd.apple.mpegurl')) {
            video1.src = stream1;
        }

        // 播放第二个流
        const video2 = document.getElementById('video2');
        if (Hls.isSupported()) {
            const hls2 = new Hls();
            hls2.loadSource(stream2);
            hls2.attachMedia(video2);
        } else if (video2.canPlayType('application/vnd.apple.mpegurl')) {
            video2.src = stream2;
        }
    }
</script>
</body>
</html>
